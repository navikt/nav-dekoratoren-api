name: Deploy to dev
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  build:
    uses: navikt/navno-ci/.github/workflows/jvm-build.yml@v1
    with:
      team: personbruker
      github-environment: dev
      image-suffix: dev-deploy
      gradle-args: clean build --no-daemon
    secrets: inherit

  deploy:
    needs: build
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    with:
      environment: dev
      cluster: dev-gcp
      resource: nais/nais.yaml
      vars: nais/dev-gcp/personbruker.json
      var: image=${{ needs.build.outputs.image }}
      hpa-resource: nais/hpa.yaml
