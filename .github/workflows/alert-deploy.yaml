name: Deploy alerts til prod
on:
  push:
    branches:
      - main
    paths:
      - 'nais/alerts.yaml'
      - '.github/workflows/alert-deploy.yaml'

permissions:
  contents: read
  id-token: write

jobs:
  alerts:
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    with:
      cluster: prod-gcp
      resource: nais/alerts.yaml
